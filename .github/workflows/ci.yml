name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  clojure:
    name: Clojure Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install.sh -o /tmp/install.sh
          sudo bash /tmp/install.sh

      - name: Run Clojure tests
        run: clojure -M:test -m docue.runner
        working-directory: clojure
        env:
          APP_ENV: test

      - name: Lint Clojure
        run: |
          curl -fsSL -o /tmp/kondo.zip "https://github.com/clj-kondo/clj-kondo/releases/download/v2026.08.04/clj-kondo-2026.08.04-linux-amd64.zip"
          sudo unzip -o /tmp/kondo.zip -d /usr/local/bin
          clj-kondo --lint src test
        working-directory: clojure
