name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
        mongodb-version: ['7.0']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-replica-set: test-rs
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run backend linter
        run: pnpm --filter backend lint
        continue-on-error: true
      
      - name: Run backend tests
        run: pnpm --filter backend test:simple
        env:
          NODE_ENV: test
          MONGODB_URL: mongodb://localhost:27017/docue-test
          SECRET: test-secret-key-for-ci
          PORT: 8000
      
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/coverage/
          retention-days: 30

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run frontend linter
        run: pnpm --filter frontend lint || echo "Frontend linting not configured"
        continue-on-error: true
      
      - name: Run frontend tests
        run: pnpm --filter frontend test:ci || echo "Frontend tests not configured"
        continue-on-error: true
        env:
          CI: true
      
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: frontend/coverage/
          retention-days: 30
          if-no-files-found: ignore

  format-check:
    name: Linting and Formatting Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Check linting and formatting
        run: pnpm run ci
        continue-on-error: true

  clojure:
    name: Clojure Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: docue_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - name: Install Clojure CLI
        run: |
          curl -fsSL https://download.clojure.org/install/linux-install.sh -o /tmp/install.sh
          sudo bash /tmp/install.sh

      - name: Run Clojure tests
        run: clojure -M:test -m docue.runner
        working-directory: clojure
        env:
          APP_ENV: test
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/docue_test?user=postgres&password=postgres

      - name: Lint Clojure
        run: |
          curl -fsSL -o /tmp/kondo.zip "https://github.com/clj-kondo/clj-kondo/releases/download/v2026.08.04/clj-kondo-2026.08.04-linux-amd64.zip"
          sudo unzip -o /tmp/kondo.zip -d /usr/local/bin
          clj-kondo --lint src test
        working-directory: clojure
