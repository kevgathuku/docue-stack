services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: docue
      POSTGRES_PASSWORD: docue
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: jdbc:postgresql://db:5432/docue?user=postgres&password=docue
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
